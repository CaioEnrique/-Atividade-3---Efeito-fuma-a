<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SMOKY · Volta começa pelo Y · Linear e Fluido</title>
  <!-- Fonte formal e elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
    }

    .smoky-wrapper {
      text-align: center;
      padding: 2rem;
    }

    .smoky-word {
      display: inline-flex;
      flex-wrap: nowrap;
      gap: 0.05em;
      font-size: clamp(4rem, 14vw, 10rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: default;
      user-select: none;
      position: relative;
    }

    .smoky-letter {
      display: inline-block;
      color: #ffffff;
      position: relative;
      will-change: transform, opacity, filter;
      transform: translateY(0) translateX(0) scale(1) rotate(0deg);
      opacity: 1;
      visibility: visible;
      filter: blur(0px);
    }

    /* ANIMAÇÃO DE EVAPORAÇÃO - IDA (ESQUERDA → DIREITA) */
    @keyframes evaporate {
      0% {
        opacity: 1;
        transform: translateY(0) translateX(0) scale(1) rotate(0deg);
        filter: blur(0px);
      }
      25% {
        opacity: 0.85;
        transform: translateY(-15px) translateX(6px) scale(1.04) rotate(10deg);
        filter: blur(2px);
      }
      50% {
        opacity: 0.55;
        transform: translateY(-40px) translateX(16px) scale(1.12) rotate(22deg);
        filter: blur(6px);
      }
      75% {
        opacity: 0.2;
        transform: translateY(-75px) translateX(30px) scale(1.24) rotate(34deg);
        filter: blur(12px);
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) translateX(45px) scale(1.42) rotate(48deg);
        filter: blur(20px);
        visibility: hidden;
      }
    }

    /* ANIMAÇÃO DE REAPARIÇÃO - VOLTA (DIREITA → ESQUERDA, COMEÇANDO PELO Y) */
    @keyframes reappear {
      0% {
        opacity: 0;
        transform: translateY(-120px) translateX(45px) scale(1.42) rotate(48deg);
        filter: blur(20px);
        visibility: visible;
      }
      25% {
        opacity: 0.2;
        transform: translateY(-75px) translateX(30px) scale(1.24) rotate(34deg);
        filter: blur(12px);
      }
      50% {
        opacity: 0.55;
        transform: translateY(-40px) translateX(16px) scale(1.12) rotate(22deg);
        filter: blur(6px);
      }
      75% {
        opacity: 0.85;
        transform: translateY(-15px) translateX(6px) scale(1.04) rotate(10deg);
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) translateX(0) scale(1) rotate(0deg);
        filter: blur(0px);
        visibility: visible;
      }
    }
  </style>
</head>
<body>
  <div class="smoky-wrapper">
    <div class="smoky-word" id="smokyWord">
      <span class="smoky-letter">S</span>
      <span class="smoky-letter">M</span>
      <span class="smoky-letter">O</span>
      <span class="smoky-letter">K</span>
      <span class="smoky-letter">Y</span>
    </div>
  </div>

  <script>
    (function() {
      const container = document.getElementById('smokyWord');
      const letters = document.querySelectorAll('.smoky-letter');
      
      // Delays para IDA: da esquerda para direita (S → M → O → K → Y)
      const delaysEvaporate = [0, 0.12, 0.24, 0.36, 0.48];
      
      // Delays para VOLTA: começando pelo Y (direita para esquerda)
      // Y = índice 4, K = índice 3, O = índice 2, M = índice 1, S = índice 0
      const delaysReappear = [0.48, 0.36, 0.24, 0.12, 0];
      
      const duration = 1.0;
      
      // Função para aplicar animação de evaporar (sumir - esquerda → direita)
      function applyEvaporate() {
        letters.forEach((letter, index) => {
          letter.style.animation = 'none';
          void letter.offsetHeight;
          letter.style.animation = `evaporate ${duration}s linear forwards`;
          letter.style.animationDelay = `${delaysEvaporate[index]}s`;
        });
      }
      
      // Função para aplicar animação de reaparecer (voltar - Y primeiro)
      function applyReappear() {
        letters.forEach((letter, index) => {
          letter.style.animation = 'none';
          void letter.offsetHeight;
          letter.style.animation = `reappear ${duration}s linear forwards`;
          letter.style.animationDelay = `${delaysReappear[index]}s`;
        });
      }
      
      // Função para reset instantâneo
      function resetToVisible() {
        letters.forEach(letter => {
          letter.style.animation = 'none';
          void letter.offsetHeight;
          letter.style.opacity = '1';
          letter.style.transform = 'translateY(0) translateX(0) scale(1) rotate(0deg)';
          letter.style.filter = 'blur(0px)';
          letter.style.visibility = 'visible';
        });
      }
      
      // Mouse enter: letras evaporam (S primeiro, Y por último)
      container.addEventListener('mouseenter', () => {
        applyEvaporate();
      });
      
      // Mouse leave: letras reaparecem (Y primeiro, S por último)
      container.addEventListener('mouseleave', () => {
        applyReappear();
      });
      
      // Estado inicial: tudo visível
      resetToVisible();
    })();
  </script>

  <style>
    /* Garantia de tela sempre limpa */
    body, .smoky-wrapper, .smoky-word, .smoky-word::before, .smoky-word::after {
      filter: none !important;
      backdrop-filter: none !important;
    }
    
    .smoky-letter {
      transition: none !important;
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    
    @media (max-width: 550px) {
      .smoky-word {
        gap: 0.02em;
        letter-spacing: 0.04em;
      }
    }
  </style>
</body>
</html>
